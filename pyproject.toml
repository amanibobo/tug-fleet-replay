[project]
name = "tug-replay"
version = "0.1.0"
description = "Replays Port of LA tug traffic as hybrid-electric telemetry and simulates battery use"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=15",
  "requests>=2.31",
  "pyyaml>=6",
  "websockets>=12",
  "rerun-sdk==0.38.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]
aws = ["awsiotsdk>=1.21", "boto3>=1.34"]

[project.scripts]
tug = "tug_replay.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline/tug_replay"]

[tool.pytest.ini_options]
testpaths = ["pipeline/tests"]

[tool.ruff]
line-length = 100
