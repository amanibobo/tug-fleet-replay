<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520">
  <defs>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8c8c8c"/><stop offset="0.45" stop-color="#4e4e4e"/><stop offset="1" stop-color="#232323"/>
    </linearGradient>
    <linearGradient id="bulwark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bdbdbd"/><stop offset="1" stop-color="#8a8a8a"/>
    </linearGradient>
    <linearGradient id="house" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d4d4d4"/><stop offset="1" stop-color="#9a9a9a"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1a1a"/><stop offset="0.5" stop-color="#3a3a3a"/><stop offset="1" stop-color="#141414"/>
    </linearGradient>
    <linearGradient id="fender" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0e0e0e"/><stop offset="0.5" stop-color="#2e2e2e"/><stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="520" fill="#ffffff"/>

  <!-- hull: short and deep, bow on the right with a near-vertical stem, rounded stern -->
  <path d="M150 318 Q146 290 180 286 L1020 254 Q1062 250 1076 282 L1086 322 Q1090 392 1030 402 L215 402 Q140 398 150 318 Z" fill="url(#hull)"/>
  <!-- light bulwark strip above the rub rail -->
  <path d="M176 298 L1024 266 L1030 292 L180 322 Z" fill="url(#bulwark)"/>
  <!-- heavy rub rail -->
  <path d="M170 330 L1060 300" stroke="#141414" stroke-width="9" stroke-linecap="round" fill="none"/>
  <!-- boot top -->
  <path d="M190 380 L1050 380 L1046 392 L196 392 Z" fill="#0f0f0f"/>

  <!-- bow fendering: a big cylindrical fender on the stem and a row of tires -->
  <rect x="1046" y="262" width="40" height="120" rx="20" fill="url(#fender)"/>
  <rect x="1004" y="252" width="28" height="30" rx="8" fill="#161616"/>
  <g fill="#121212">
    <ellipse cx="290" cy="350" rx="20" ry="18"/><ellipse cx="368" cy="347" rx="20" ry="18"/><ellipse cx="446" cy="344" rx="20" ry="18"/>
    <ellipse cx="524" cy="341" rx="20" ry="18"/><ellipse cx="602" cy="338" rx="20" ry="18"/><ellipse cx="680" cy="335" rx="20" ry="18"/>
    <ellipse cx="758" cy="332" rx="20" ry="18"/><ellipse cx="836" cy="329" rx="20" ry="18"/><ellipse cx="914" cy="326" rx="20" ry="18"/>
  </g>

  <!-- aft deck: towing winch and a low rail -->
  <rect x="196" y="262" width="110" height="28" rx="8" fill="#2c2c2c"/>
  <rect x="236" y="246" width="26" height="18" rx="4" fill="#3a3a3a"/>
  <path d="M190 282 L330 276" stroke="#5a5a5a" stroke-width="3" fill="none"/>

  <!-- deckhouse: one level, soft corners, a few portholes -->
  <path d="M352 290 L352 212 Q352 194 370 194 L810 194 Q828 194 828 212 L828 274 Z" fill="url(#house)"/>
  <g fill="#1f1f1f">
    <circle cx="396" cy="236" r="9"/><circle cx="430" cy="235" r="9"/>
    <rect x="730" y="222" width="34" height="26" rx="4"/><rect x="774" y="220" width="34" height="26" rx="4"/>
  </g>
  <!-- charging hatch on the house side, a hybrid tell -->
  <rect x="470" y="236" width="44" height="30" rx="4" fill="#5a5a5a"/>
  <rect x="478" y="244" width="28" height="14" rx="2" fill="#2a2a2a"/>

  <!-- wheelhouse: tall, with raked all-round glass -->
  <path d="M452 194 L466 112 Q470 94 490 92 L674 86 Q694 86 698 104 L712 194 Z" fill="#c9c9c9"/>
  <path d="M474 184 L486 116 Q488 106 498 106 L668 100 Q678 100 680 110 L692 184 Z" fill="url(#glass)"/>
  <!-- window mullions -->
  <g stroke="#bdbdbd" stroke-width="4">
    <line x1="528" y1="104" x2="522" y2="184"/><line x1="582" y1="102" x2="582" y2="184"/><line x1="636" y1="101" x2="642" y2="184"/>
  </g>
  <rect x="446" y="186" width="272" height="10" rx="3" fill="#6a6a6a"/>

  <!-- short mast with radar and nav light -->
  <rect x="598" y="38" width="6" height="56" fill="#2a2a2a"/>
  <rect x="566" y="56" width="70" height="5" fill="#2a2a2a"/>
  <rect x="584" y="42" width="36" height="6" rx="3" fill="#333"/>
  <circle cx="601" cy="34" r="5" fill="#111"/>

  <!-- small vents aft of the house instead of a tall funnel -->
  <rect x="744" y="166" width="30" height="28" rx="4" fill="#3c3c3c"/>
  <rect x="782" y="172" width="22" height="22" rx="4" fill="#3c3c3c"/>

  <!-- waterline shadow -->
  <path d="M172 400 L1030 400 Q1072 392 1082 362 L1088 396 Q1082 412 1026 414 L206 414 Q160 412 172 400 Z" fill="#2a2a2a"/>
</svg>
