<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520">
  <defs>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a9a9a"/><stop offset="0.5" stop-color="#5a5a5a"/><stop offset="1" stop-color="#262626"/>
    </linearGradient>
    <linearGradient id="house" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9a9a9a"/><stop offset="0.5" stop-color="#c9c9c9"/><stop offset="1" stop-color="#7d7d7d"/>
    </linearGradient>
    <linearGradient id="wheel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b5b5b5"/><stop offset="0.5" stop-color="#e2e2e2"/><stop offset="1" stop-color="#8e8e8e"/>
    </linearGradient>
    <linearGradient id="stack" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4a4a4a"/><stop offset="0.5" stop-color="#8a8a8a"/><stop offset="1" stop-color="#3a3a3a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="520" fill="#ffffff"/>
  <!-- hull: bow on the right, raised sheer, rounded stern on the left -->
  <path d="M120 332 Q110 300 150 292 L1010 262 Q1075 258 1095 300 L1105 340 Q1100 400 1040 410 L190 410 Q115 405 120 332 Z" fill="url(#hull)"/>
  <!-- bulwark line and rub rail -->
  <path d="M150 300 L1012 270" stroke="#777" stroke-width="3" fill="none"/>
  <path d="M150 340 L1070 318" stroke="#1a1a1a" stroke-width="6" fill="none" opacity="0.9"/>
  <!-- fenders: tire rows along the hull and a bow pudding -->
  <g fill="#0d0d0d">
    <ellipse cx="1090" cy="318" rx="22" ry="46"/>
    <circle cx="260" cy="356" r="16"/><circle cx="330" cy="354" r="16"/><circle cx="400" cy="352" r="16"/><circle cx="470" cy="350" r="16"/>
    <circle cx="540" cy="348" r="16"/><circle cx="610" cy="346" r="16"/><circle cx="680" cy="344" r="16"/><circle cx="750" cy="342" r="16"/>
    <circle cx="820" cy="339" r="16"/><circle cx="890" cy="336" r="16"/><circle cx="960" cy="333" r="16"/>
  </g>
  <!-- main deckhouse -->
  <path d="M330 292 L330 210 Q330 196 344 196 L760 196 Q776 196 776 212 L776 282 Z" fill="url(#house)"/>
  <g fill="#1e1e1e">
    <rect x="372" y="226" width="30" height="24" rx="3"/><rect x="420" y="226" width="30" height="24" rx="3"/><rect x="468" y="226" width="30" height="24" rx="3"/>
    <rect x="620" y="226" width="30" height="24" rx="3"/><rect x="668" y="226" width="30" height="24" rx="3"/><rect x="716" y="226" width="30" height="24" rx="3"/>
  </g>
  <!-- wheelhouse, tall for visibility over a ship's deck -->
  <path d="M470 196 L470 126 Q470 110 486 108 L640 100 Q660 100 660 118 L660 196 Z" fill="url(#wheel)"/>
  <g fill="#161616">
    <rect x="484" y="128" width="34" height="38" rx="3"/><rect x="526" y="126" width="34" height="38" rx="3"/><rect x="568" y="124" width="34" height="38" rx="3"/><rect x="610" y="122" width="34" height="38" rx="3"/>
  </g>
  <rect x="464" y="176" width="204" height="8" fill="#5c5c5c"/>
  <!-- stack with cap -->
  <path d="M700 196 L704 118 L746 112 L752 196 Z" fill="url(#stack)"/>
  <rect x="696" y="108" width="60" height="12" rx="3" fill="#222"/>
  <!-- mast, radar, lights -->
  <rect x="553" y="40" width="6" height="70" fill="#2a2a2a"/>
  <rect x="520" y="66" width="72" height="5" fill="#2a2a2a"/>
  <rect x="536" y="44" width="40" height="6" rx="3" fill="#333"/>
  <circle cx="556" cy="36" r="6" fill="#111"/>
  <!-- towing winch and staple on the aft deck, bitts forward -->
  <rect x="200" y="258" width="90" height="34" rx="6" fill="#262626"/>
  <rect x="236" y="236" width="18" height="24" fill="#303030"/>
  <rect x="840" y="246" width="14" height="20" fill="#2b2b2b"/><rect x="880" y="244" width="14" height="20" fill="#2b2b2b"/>
  <!-- waterline shadow -->
  <path d="M140 408 L1040 408 Q1070 400 1090 372 L1096 404 Q1090 418 1030 420 L170 420 Q130 418 140 408 Z" fill="#2a2a2a"/>
</svg>
